[package]
name = "tauri-app"
version = "0.1.1"
description = "Fluo — Browse in flow. Translate on-device."
authors = ["apple-out"]
license = "MIT"
repository = "https://github.com/apple-out/transratebrowser"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["json", "form", "query", "stream"] }
rusqlite = { version = "0.42", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
url = "2"
regex = "1"
encoding_rs = "0.8"
llama-cpp-2 = { version = "0.1.161", default-features = false, features = [] }
llama-cpp-sys-2 = { version = "0.1.161", default-features = false }

[features]
default = []
vulkan = ["llama-cpp-2/vulkan"]
cuda = ["llama-cpp-2/cuda"]
universal-cpu = ["llama-cpp-2/dynamic-link"]

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dxgi",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
