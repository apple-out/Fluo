name: Build Fluo iOS (Unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
      - "tauri-app/src-tauri/src/content_extract.js"
      - "tauri-app/src-tauri/src/inline_translate.js"
      - "tauri-app/src-tauri/src/inline_restore.js"
      - "tauri-app/src-tauri/src/find_in_page.js"
      - "tauri-app/src-tauri/src/region_picker.js"

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26+ (iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app || true
          SELECTED="$(python3 - <<'PY'
          import glob, os, subprocess, sys
          best = None
          for app in sorted(glob.glob('/Applications/Xcode*.app')):
              if os.path.islink(app):
                  continue
              try:
                  env = dict(os.environ, DEVELOPER_DIR=f'{app}/Contents/Developer')
                  ver = subprocess.check_output(
                      ['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'],
                      env=env,
                      text=True
                  ).strip()
                  parts = tuple(int(x) for x in ver.split('.') if x.isdigit())
                  print(f'Candidate {app} -> iphoneos {ver}', file=sys.stderr, flush=True)
                  if parts and parts[0] >= 26:
                      if best is None or parts > best[0]:
                          best = (parts, app)
              except Exception as exc:
                  print(f'Skipping {app}: {exc}', file=sys.stderr, flush=True)
          if best:
              print(best[1], end='')
          PY
          )"
          if [ -z "$SELECTED" ]; then
            echo "::error::No Xcode with iOS 26+ SDK found on runner"
            exit 1
          fi
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Rust iOS target & build tools
        run: |
          rustup target add aarch64-apple-ios
          brew install xcodegen ninja cmake

      - name: Cache Rust & llama.cpp iOS build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ios/rust-core/target
          key: fluo-ios-rust-sdk26-v2-${{ runner.os }}-${{ hashFiles('ios/rust-core/Cargo.toml', 'ios/rust-core/src/**') }}
          restore-keys: |
            fluo-ios-rust-sdk26-v2-${{ runner.os }}-

      - name: Build Rust inference static library (aarch64-apple-ios + Metal)
        working-directory: ios/rust-core
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
          CMAKE_OSX_ARCHITECTURES: "arm64"
          CMAKE_SYSTEM_NAME: "iOS"
          CMAKE_GENERATOR: "Ninja"
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          IOS_FLAGS="-isysroot $SDK_PATH -arch arm64 -miphoneos-version-min=16.0"
          export CMAKE_OSX_SYSROOT="$SDK_PATH"
          export CFLAGS_aarch64_apple_ios="$IOS_FLAGS"
          export CXXFLAGS_aarch64_apple_ios="$IOS_FLAGS"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios="$IOS_FLAGS"
          cargo build --release --target aarch64-apple-ios --features metal
          ls -lh target/aarch64-apple-ios/release/libfluo_ios_core.a

      - name: Bundle shared JS scripts & 1024x1024 AppIcon
        run: |
          mkdir -p ios/FluoIOS/Scripts
          cp tauri-app/src-tauri/src/content_extract.js ios/FluoIOS/Scripts/
          cp tauri-app/src-tauri/src/inline_translate.js ios/FluoIOS/Scripts/
          cp tauri-app/src-tauri/src/inline_restore.js ios/FluoIOS/Scripts/
          cp tauri-app/src-tauri/src/find_in_page.js ios/FluoIOS/Scripts/
          cp tauri-app/src-tauri/src/region_picker.js ios/FluoIOS/Scripts/
          swift - <<'SWIFT'
          import CoreGraphics
          import Foundation
          import ImageIO
          import UniformTypeIdentifiers

          let inURL = URL(fileURLWithPath: "docs/icon.png")
          let outURL = URL(fileURLWithPath: "ios/FluoIOS/Assets.xcassets/AppIcon.appiconset/AppIcon.png")
          guard let src = CGImageSourceCreateWithURL(inURL as CFURL, nil),
                let img = CGImageSourceCreateImageAtIndex(src, 0, nil) else {
              fatalError("Failed to load docs/icon.png")
          }
          let inset = 180
          let cropRect = CGRect(x: inset, y: inset, width: img.width - inset * 2, height: img.height - inset * 2)
          guard let cropped = img.cropping(to: cropRect) else {
              fatalError("Crop failed")
          }
          let cs = CGColorSpaceCreateDeviceRGB()
          let bitmapInfo = CGBitmapInfo.byteOrder32Big.rawValue | CGImageAlphaInfo.noneSkipLast.rawValue
          guard let ctx = CGContext(data: nil, width: 1024, height: 1024, bitsPerComponent: 8, bytesPerRow: 0, space: cs, bitmapInfo: bitmapInfo) else {
              fatalError("CGContext failed")
          }
          ctx.setFillColor(red: 0.04, green: 0.14, blue: 0.72, alpha: 1.0)
          ctx.fill(CGRect(x: 0, y: 0, width: 1024, height: 1024))
          ctx.interpolationQuality = .high
          ctx.draw(cropped, in: CGRect(x: 0, y: 0, width: 1024, height: 1024))
          guard let finalImg = ctx.makeImage(),
                let dest = CGImageDestinationCreateWithURL(outURL as CFURL, UTType.png.identifier as CFString, 1, nil) else {
              fatalError("Output failed")
          }
          CGImageDestinationAddImage(dest, finalImg, nil)
          CGImageDestinationFinalize(dest)
          SWIFT
          sips -g pixelWidth -g pixelHeight -g hasAlpha ios/FluoIOS/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project & build unsigned Fluo.app
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild \
            -project FluoIOS.xcodeproj \
            -scheme FluoIOS \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package Fluo-iOS-v0.1.1-unsigned.ipa
        working-directory: ios
        run: |
          rm -rf Payload Fluo-iOS-v0.1.1-unsigned.ipa
          mkdir -p Payload
          APP_PATH="$(find build/DerivedData -name "Fluo.app" -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "Fluo.app not found!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/Fluo.app
          zip -r -q Fluo-iOS-v0.1.1-unsigned.ipa Payload
          ls -lh Fluo-iOS-v0.1.1-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluo-iOS-v0.1.1-unsigned-ipa
          path: ios/Fluo-iOS-v0.1.1-unsigned.ipa
          retention-days: 30
